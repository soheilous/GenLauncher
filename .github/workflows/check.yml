name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build

  app:
    name: Launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run build # the app embeds the built UI
      - run: cargo test
        working-directory: src-tauri

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # stale texts and {values} that do not match the English text fail; a missing translation only falls back to English
      - run: node tools/check-i18n.mjs

  demo:
    name: Website demo is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the interactive demo on the website is built from the interface; a commit that changed one must carry the other
      # (the pre-commit hook does it: run `npm run build:demo` if this fails)
      - run: node tools/build-demo.mjs --check
