name: Release

# Pushing a tag such as v0.1.0 builds the Windows setup program and attaches it to a draft release for review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: lets this build offer "Sign in with Google" (see README)
          GENLAUNCHER_GOOGLE_CLIENT_SECRET: ${{ secrets.GENLAUNCHER_GOOGLE_CLIENT_SECRET }}
          # signs the setup program so installed copies can verify an update (the public key is in tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GenLauncher ${{ github.ref_name }}
          releaseBody: |
            **GenLauncher preview** for Windows 10/11: a mod launcher for Command & Conquer: Generals and Zero Hour.
            Download `GenLauncher_*_x64-setup.exe` below. It installs for the current user and needs no administrator rights.

            - **Windows SmartScreen may warn** ("Windows protected your PC") because the installer is not code-signed yet.
              Click **More info**, then **Run anyway**. Code signing is planned.
            - The interface is available in 13 languages. The translations were written without native review, so
              corrections are welcome (see the README, "Translations").
            - GenLauncher hosts no mods: it opens each mod's own page and takes the file you download, or, where the author published a direct link, downloads that file when you press Install.

            Source and issues: https://github.com/soheilous/GenLauncher
          releaseDraft: true
          prerelease: true
          args: --bundles nsis
