[package]
name = "genlauncher2"
version = "0.1.10"
description = "A mod launcher for Command & Conquer: Generals and Zero Hour"
authors = ["soheilous"]
license = "MIT"
repository = "https://github.com/soheilous/GenLauncher"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "genlauncher2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
futures = "0.3"
thiserror = "2"
log = "0.4"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
base64 = "0.22"
minisign-verify = "0.2"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.2", default-features = false, features = ["deflate", "deflate64", "bzip2"] }
sevenz-rust2 = "0.24.0"
unrar = "0.5.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
